name: lazo_mobile
description: Fundamentos de Lazo; sin funcionalidades de negocio.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.47.8'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.1.1
  firebase_core: 5.1.0
  firebase_auth: 7.0.1
  cloud_firestore: 7.1.0
  cloud_functions: 7.0.1
  firebase_app_check: 0.5.1
  firebase_crashlytics: 6.0.1
  intl: 0.20.3
  timezone: 0.11.2
  json_annotation: 4.12.0
  uuid: 4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
  build_runner: 2.17.1
  json_serializable: 6.15.2

flutter:
  uses-material-design: true
  generate: true

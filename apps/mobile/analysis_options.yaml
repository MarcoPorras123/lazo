include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - '**/*.g.dart'
    - lib/app/l10n/generated/**
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    avoid_print: true
    unawaited_futures: true

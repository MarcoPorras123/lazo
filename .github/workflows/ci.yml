name: Lazo foundations
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  FUNCTIONS_DISCOVERY_TIMEOUT: '60'
concurrency:
  group: lazo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:scripts
      - run: npm run test:emulator
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mobile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
        working-directory: apps/mobile
      - run: dart run build_runner build --delete-conflicting-outputs
        working-directory: apps/mobile
      - run: flutter gen-l10n
        working-directory: apps/mobile
      - run: flutter analyze
        working-directory: apps/mobile
      - run: flutter test
        working-directory: apps/mobile
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        flavor: [dev, staging, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mobile
      - run: dart run build_runner build --delete-conflicting-outputs
        working-directory: apps/mobile
      - run: chmod +x android/gradlew
        working-directory: apps/mobile
      - run: flutter build apk --debug --flavor ${{ matrix.flavor }} --target lib/main_${{ matrix.flavor }}.dart
        working-directory: apps/mobile
  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        flavor: [dev, staging, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mobile
      - run: dart run build_runner build --delete-conflicting-outputs
        working-directory: apps/mobile
      - run: flutter build ios --simulator --debug --flavor ${{ matrix.flavor }} --target lib/main_${{ matrix.flavor }}.dart
        working-directory: apps/mobile
